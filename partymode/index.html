<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Wedding</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Web font so phones and laptops match -->
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: lime;
        color: blue;
        font-family: "Comic Neue", cursive, sans-serif;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        font-size: clamp(20px, 4vw, 36px);
      }
      p {
        margin: 0.5em;
      }
      .party-actions {
        margin-top: 1.5em;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.6em;
      }
      .party-button,
      .back-link {
        font: inherit;
        padding: 0.4em 0.8em;
        border: 3px solid blue;
        background: yellow;
        color: blue;
        text-decoration: none;
        cursor: pointer;
      }
      .party-button:hover,
      .back-link:hover {
        background: white;
      }
      .blink {
        animation: blink 1s step-start infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <p class="blink">Wedding.</p>
    <p>Christine &amp; Riley.</p>
    <p>Durango, CO.</p>
    <p>September 26, 2026.</p>
    <p>Be there. Bye.</p>
    <div class="party-actions">
      <button class="party-button" type="button" id="playSong">Play</button>
      <a class="back-link" href="https://www.christineandriley.love/">Back to real site</a>
    </div>
    <iframe
      id="partyPlayer"
      title="Party mode player"
      width="1"
      height="1"
      style="border: 0; position: absolute; left: -9999px;"
      allow="autoplay"
      data-src="https://www.youtube.com/embed/yUZeZNxiD-M?autoplay=1"
    ></iframe>
    <script>
      const playButton = document.getElementById('playSong');
      const partyPlayer = document.getElementById('partyPlayer');
      if (playButton && partyPlayer) {
        playButton.addEventListener('click', () => {
          if (!partyPlayer.src) {
            partyPlayer.src = partyPlayer.dataset.src;
          }
        });
      }
    </script>
  </body>
</html>
