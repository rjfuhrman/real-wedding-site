<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Wedding</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Web font so phones and laptops match -->
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet" />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: lime;
        color: blue;
        font-family: "Comic Neue", cursive, sans-serif;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: center;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        font-size: clamp(20px, 4vw, 36px);
      }
      p {
        margin: 0.5em;
      }
      .party-actions {
        margin-top: 1.5em;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.6em;
      }
      .song-note {
        font-weight: 700;
      }
      .party-player {
        width: min(420px, 90vw);
        border: 4px dashed blue;
        background: white;
      }
      .party-button,
      .back-link {
        font: inherit;
        padding: 0.4em 0.8em;
        border: 3px solid blue;
        background: yellow;
        color: blue;
        text-decoration: none;
        cursor: pointer;
      }
      .party-button:hover,
      .back-link:hover {
        background: white;
      }
      .blink {
        animation: blink 1s step-start infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <p class="blink">Wedding.</p>
    <p>Christine &amp; Riley.</p>
    <p>Durango, CO.</p>
    <p>September 26, 2026.</p>
    <p>Be there. Bye.</p>
    <div class="party-actions">
      <p class="song-note">Get Low by Lil Jon.</p>
      <iframe
        class="party-player"
        src="https://open.spotify.com/embed/track/0r2Bul2NuCViraT2zX1l5j?utm_source=generator&autoplay=1"
        width="100%"
        height="152"
        frameborder="0"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
        loading="lazy"
        title="Get Low by Lil Jon"
      ></iframe>
      <button class="party-button" type="button" id="playSong">Tap to play if it doesn’t start</button>
      <a class="back-link" href="https://www.christineandriley.love/">Back to real site</a>
    </div>
    <script>
      const playButton = document.getElementById('playSong');
      if (playButton) {
        playButton.addEventListener('click', () => {
          window.open('https://open.spotify.com/track/0r2Bul2NuCViraT2zX1l5j', '_blank', 'noopener');
        });
      }
    </script>
  </body>
</html>
